name: Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_ADMIN_EMAIL: admin@example.com
      TEST_ADMIN_PASSWORD: Admin123!
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin123!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r server/requirements-test.txt

      - name: Start services
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose up -d
          else
            echo "Neither docker compose nor docker-compose is available"
            exit 127
          fi

      - name: Wait for API
        run: |
          for i in {1..30}; do
            payload=$(curl -s http://localhost:8081/healthz || true)
            if echo "$payload" | jq -e '
              .status == "ok" and
              .dependencies.postgresql == "ok" and
              .dependencies.redis == "ok"
            ' >/dev/null 2>&1; then
              echo "API, PostgreSQL, and Redis are ready";
              exit 0;
            fi;
            echo "Waiting for API dependencies... payload: ${payload}";
            sleep 5;
          done;
          echo "API dependencies did not become ready in time";
          if docker compose version >/dev/null 2>&1; then
            docker compose logs --no-color server || true
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose logs --no-color server || true
          fi
          exit 1

      - name: Run database migrations
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose exec -T server chronodesk-migrate -seed
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose exec -T server chronodesk-migrate -seed
          else
            echo "Compose command not found for migration"
            exit 127
          fi

      - name: Run smoke tests
        run: make smoke

      - name: Dump server logs on failure
        if: failure()
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose logs --no-color server || true
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose logs --no-color server || true
          fi

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-reports
          path: server/reports/*.html

      - name: Stop services
        if: always()
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose down
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose down
          else
            echo "Skip compose shutdown: compose command not found"
          fi
