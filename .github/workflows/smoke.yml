name: Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r server/requirements-test.txt

      - name: Start services
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose up -d
          else
            echo "Neither docker compose nor docker-compose is available"
            exit 127
          fi

      - name: Wait for API
        run: |
          for i in {1..30}; do
            payload=$(curl -s http://localhost:8081/healthz || true)
            if echo "$payload" | grep -q '"database":"ok"'; then
              echo "API and database are ready";
              exit 0;
            fi;
            echo "Waiting for API/DB... payload: ${payload}";
            sleep 5;
          done;
          echo "API/database did not become ready in time";
          if docker compose version >/dev/null 2>&1; then
            docker compose logs --no-color server || true
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose logs --no-color server || true
          fi
          exit 1

      - name: Run smoke tests
        run: make smoke

      - name: Dump server logs on failure
        if: failure()
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose logs --no-color server || true
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose logs --no-color server || true
          fi

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: server/reports/*.html

      - name: Stop services
        if: always()
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose down
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose down
          else
            echo "Skip compose shutdown: compose command not found"
          fi
