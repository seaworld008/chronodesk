name: Dependency Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 19 * * 0"

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Scan current source snapshot for secrets
        run: >-
          go run github.com/zricethezav/gitleaks/v8@v8.28.0
          dir .
          --redact=100
          --no-banner
          --no-color
          --ignore-gitleaks-allow

  go-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Test server
        run: go test ./... -count=1

  go-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          check-latest: true
          cache-dependency-path: sdk/go/go.sum

      - name: Test Go SDK
        run: go test ./... -count=1

  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Test server with race detector
        run: go test -race ./... -count=1

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHRONODESK_REDIS_INTEGRATION: "1"
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Verify Redis release-gate integrations
        run: >-
          go test ./internal/services
          -run '^(TestRedisAgentExecutionGuardIntegration|TestSchedulerRedisLeaseIntegration)$'
          -count=1

  go-vuln:
    name: go-vuln (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            working-directory: server
            go-version-file: server/go.mod
            cache-dependency-path: server/go.sum
          - component: sdk
            working-directory: sdk/go
            go-version-file: sdk/go/go.mod
            cache-dependency-path: sdk/go/go.sum
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
          check-latest: true
          cache-dependency-path: ${{ matrix.cache-dependency-path }}

      - name: Scan reachable Go vulnerabilities
        working-directory: ${{ matrix.working-directory }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  go:
    name: go
    if: ${{ always() }}
    needs:
      - go-unit
      - go-sdk
      - go-race
      - redis-integration
      - go-vuln
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce every Go security gate
        env:
          GO_UNIT_RESULT: ${{ needs.go-unit.result }}
          GO_SDK_RESULT: ${{ needs.go-sdk.result }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          REDIS_INTEGRATION_RESULT: ${{ needs.redis-integration.result }}
          GO_VULN_RESULT: ${{ needs.go-vuln.result }}
        run: |
          failures=0
          for gate in \
            "go-unit=${GO_UNIT_RESULT}" \
            "go-sdk=${GO_SDK_RESULT}" \
            "go-race=${GO_RACE_RESULT}" \
            "redis-integration=${REDIS_INTEGRATION_RESULT}" \
            "go-vuln=${GO_VULN_RESULT}"
          do
            if [ "${gate#*=}" != "success" ]; then
              echo "::error::${gate}"
              failures=1
            fi
          done
          exit "${failures}"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:security

      - name: Validate OpenAPI 3.2 contract
        run: |
          npx --yes @redocly/cli@2.41.1 lint ../server/internal/openapi/openapi.yaml --format=stylish
          npx --yes @redocly/cli@2.41.1 lint ../server/internal/humanopenapi/openapi.json --format=stylish
          npx --yes @stoplight/spectral-cli@6.16.2 lint \
            -r ../server/internal/openapi/.spectral.yaml \
            ../server/internal/openapi/openapi.yaml \
            --fail-severity=warn
          npx --yes @stoplight/spectral-cli@6.16.2 lint \
            -r ../server/internal/openapi/.spectral.yaml \
            ../server/internal/humanopenapi/openapi.json \
            --fail-severity=warn

      - name: Verify generated Human Web API types
        run: |
          npm run check:human-api
          npm run test:human-api

      - name: Test navigation contracts
        run: npm run test:navigation

      - name: Test project scope contracts
        run: npm run test:project-scope

      - name: Test CI runtime contracts
        run: npm run test:ci-runtime

      - name: Validate AsyncAPI 3.1 contract
        run: npx --yes @asyncapi/cli@6.0.2 validate ../server/internal/asyncapi/asyncapi.yaml

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
