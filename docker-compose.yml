name: chronodesk

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: chronodesk
      POSTGRES_USER: chronodesk
      POSTGRES_PASSWORD: chronodesk_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronodesk -d chronodesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务 (开发环境)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0}
        COMMIT: ${COMMIT:-development}
        BUILD_DATE: ${BUILD_DATE:-development}
    ports:
      - "8081:8081"
    environment:
      - GIN_MODE=debug
      - ENVIRONMENT=development
      - PORT=8081
      - APP_URL=http://localhost:8081
      - AUTO_MIGRATE=true
      - DATABASE_URL=postgres://chronodesk:chronodesk_dev_only@postgres:5432/chronodesk?sslmode=disable
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=chronodesk
      - DB_PASSWORD=chronodesk_dev_only
      - DB_NAME=chronodesk
      # 仅限隔离的 Compose 开发网络；共享/生产 PostgreSQL 必须使用 TLS。
      - POSTGRES_ALLOW_INSECURE=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - REDIS_ALLOW_INSECURE=true
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AGENT_JWT_SECRET=development-agent-jwt-secret-not-for-production-2026
      - AGENT_CREDENTIAL_PEPPER=development-agent-credential-pepper-not-for-production-2026
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - attachment_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # 前端服务 (开发环境)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://server:8081
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/node_modules/.vite:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700
      - /app/node_modules/.vite-temp:rw,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  attachment_data:
    driver: local
