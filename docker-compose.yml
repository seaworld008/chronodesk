services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:18.4-alpine
    container_name: ticket-postgres
    environment:
      POSTGRES_DB: ticket_system
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:8.8-alpine
    container_name: ticket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务 (开发环境)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: ticket-server
    ports:
      - "8081:8081"
    environment:
      - GIN_MODE=debug
      - ENVIRONMENT=development
      - PORT=8081
      - APP_URL=http://localhost:8081
      - AUTO_MIGRATE=true
      - DATABASE_URL=postgres://ticket_user:ticket_password@postgres:5432/ticket_system?sslmode=disable
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ticket_user
      - DB_PASSWORD=ticket_password
      - DB_NAME=ticket_system
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AGENT_JWT_SECRET=development-agent-jwt-secret-not-for-production-2026
      - AGENT_CREDENTIAL_PEPPER=development-agent-credential-pepper-not-for-production-2026
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ticket-network
    restart: unless-stopped

  # 前端服务 (开发环境)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: ticket-web
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://server:8081
    depends_on:
      server:
        condition: service_healthy
    networks:
      - ticket-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ticket-network:
    driver: bridge
