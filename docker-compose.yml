name: chronodesk

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: chronodesk
      POSTGRES_USER: chronodesk
      POSTGRES_PASSWORD: chronodesk_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronodesk -d chronodesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 开发环境一次性建立非 owner、NOBYPASSRLS 的应用运行角色。该服务
  # 同时修复已有 volume 的授权；生产环境应由独立数据库发布流程完成。
  postgres-runtime-role:
    image: postgres:18.4-alpine
    environment:
      PGPASSWORD: chronodesk_dev_only
    command:
      [
        "psql",
        "-v",
        "ON_ERROR_STOP=1",
        "-h",
        "postgres",
        "-U",
        "chronodesk",
        "-d",
        "chronodesk",
        "-c",
        "DO $$chronodesk$$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'chronodesk_runtime') THEN CREATE ROLE chronodesk_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'chronodesk_runtime_dev_only'; ELSE ALTER ROLE chronodesk_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'chronodesk_runtime_dev_only'; END IF; IF pg_has_role('chronodesk_runtime', 'chronodesk', 'MEMBER') THEN REVOKE chronodesk FROM chronodesk_runtime; END IF; END $$chronodesk$$;",
        "-c",
        "GRANT CONNECT ON DATABASE chronodesk TO chronodesk_runtime; GRANT USAGE ON SCHEMA public TO chronodesk_runtime; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO chronodesk_runtime; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO chronodesk_runtime; ALTER DEFAULT PRIVILEGES FOR ROLE chronodesk IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO chronodesk_runtime; ALTER DEFAULT PRIVILEGES FOR ROLE chronodesk IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO chronodesk_runtime;"
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Redis 缓存
  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 知识库全文＋向量混合索引（权威数据仍在 PostgreSQL）
  opensearch:
    image: opensearchproject/opensearch:3.5.0
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      # 仅用于约 2 GiB Docker VM 的单节点开发栈；生产环境必须按节点内存、
      # 索引规模与查询负载独立做容量规划，不得照搬此堆大小。
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # 后端服务 (开发环境)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.2.0}
        COMMIT: ${COMMIT:-development}
        BUILD_DATE: ${BUILD_DATE:-development}
    ports:
      - "8081:8081"
    environment:
      - GIN_MODE=debug
      - ENVIRONMENT=development
      - PORT=8081
      - APP_URL=http://localhost:8081
      - AUTO_MIGRATE=true
      - DATABASE_MIGRATION_URL=postgres://chronodesk:chronodesk_dev_only@postgres:5432/chronodesk?sslmode=disable
      - DATABASE_RUNTIME_URL=postgres://chronodesk_runtime:chronodesk_runtime_dev_only@postgres:5432/chronodesk?sslmode=disable
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=chronodesk_runtime
      - DB_PASSWORD=chronodesk_runtime_dev_only
      - DB_NAME=chronodesk
      # 仅限隔离的 Compose 开发网络；共享/生产 PostgreSQL 必须使用 TLS。
      - POSTGRES_ALLOW_INSECURE=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - REDIS_ALLOW_INSECURE=true
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_ALLOW_INSECURE=true
      - OPENSEARCH_INDEX_PREFIX=chronodesk-knowledge
      - OPENSEARCH_SEARCH_PIPELINE=chronodesk-knowledge-hybrid
      - OPENSEARCH_VECTOR_DIMENSION=384
      - METRICS_ENABLED=true
      - AUDIT_EXPORT_STORAGE_BACKEND=local
      - AUDIT_EXPORT_STORAGE_DIR=/app/data/audit-exports
      - AUDIT_EXPORT_LOCAL_DEPLOYMENT_MODE=single
      - CHRONODESK_REPLICA_COUNT=1
      - AUDIT_EXPORT_WORKER_ID=chronodesk-compose-audit-export-1
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AGENT_JWT_SECRET=development-agent-jwt-secret-not-for-production-2026
      - AGENT_CREDENTIAL_PEPPER=development-agent-credential-pepper-not-for-production-2026
      - AGENT_ATTACHMENT_STORAGE_BACKEND=local
      - AGENT_ATTACHMENT_DIR=/app/data/agent-attachments
      - AGENT_ATTACHMENT_STAGING_DIR=/app/data/agent-attachment-staging
      - AGENT_ATTACHMENT_LOCAL_DEPLOYMENT_MODE=single
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-runtime-role:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - attachment_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # 前端服务 (开发环境)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://server:8081
      # 约 2 GiB 的本地 Docker VM 同时运行 OpenSearch 时，限制 Vite 首次
      # 依赖优化的堆峰值，避免健康检查期间触发整容器 OOM 重启。
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/node_modules/.vite:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700
      - /app/node_modules/.vite-temp:rw,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  attachment_data:
    driver: local
  opensearch_data:
    driver: local
