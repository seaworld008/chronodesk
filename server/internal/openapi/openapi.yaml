    OAuthTokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type, project_key, resource]
      properties:
        grant_type:
          type: string
          const: client_credentials
        client_id:
          type: string
        client_secret:
          type: string
          writeOnly: true
        scope:
          type: string
          description: Space-delimited subset of the principal's allowed scopes.
        project_key:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,15}$'
          description: |
            Exactly one authorized project key. It is persisted in the token
            and must match Agent REST paths, MCP tool arguments, or A2A
            metadata at execution time.
        resource:
          type: string
          format: uri
          description: |
            RFC 8707 resource indicator. It must exactly equal one of
            `${APP_URL}/mcp`, `${APP_URL}/api/v2`, or `${APP_URL}/a2a/v1`.
            The resulting token is valid only at that resource.
          examples:
            - https://chronodesk.example/mcp
            - https://chronodesk.example/api/v2
            - https://chronodesk.example/a2a/v1
    OAuthTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope, resource, project_key]
      properties:
        access_token:
          type: string
          readOnly: true
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 3600
        scope:
          type: string
          description: Space-delimited scope value, including in the JWT access-token claim.
        resource:
          type: string
          format: uri
        project_key:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,15}$'
    OAuthError:
      type: object
      additionalProperties: false
      required: [error, error_description]
      properties:
        error:
          type: string
          enum: [invalid_client, invalid_request, invalid_scope, invalid_target, unsupported_grant_type, temporarily_unavailable]
        error_description:
          type: string
    ProtectedResourceMetadata:
      type: object
      additionalProperties: false
      required: [resource, authorization_servers, bearer_methods_supported, scopes_supported]
      properties:
        resource:
          type: string
          format: uri-reference
        authorization_servers:
          type: array
          minItems: 1
          items:
            type: string
            format: uri-reference
        bearer_methods_supported:
          type: array
          items:
            type: string
            enum: [header]
        scopes_supported:
          type: array
          items:
            $ref: '#/components/schemas/AgentScope'
        resource_name:
          type: string
          description: Human-readable name of the protected resource.
    AuthorizationServerMetadata:
      type: object
      additionalProperties: false
      required:
        - issuer
        - token_endpoint
        - grant_types_supported
        - token_endpoint_auth_methods_supported
        - scopes_supported
        - response_types_supported
        - project_key_parameter_supported
      properties:
        issuer:
          type: string
          format: uri-reference
        token_endpoint:
          type: string
          format: uri-reference
        grant_types_supported:
          type: array
          items:
            type: string
            enum: [client_credentials]
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
            enum: [client_secret_post, client_secret_basic]
        scopes_supported:
          type: array
          items:
            $ref: '#/components/schemas/AgentScope'
        response_types_supported:
          type: array
          maxItems: 0
        client_id_metadata_document_supported:
          type: boolean
          const: false
          description: ChronoDesk uses pre-registered client credentials.
        authorization_response_iss_parameter_supported:
          type: boolean
          const: false
          description: No authorization endpoint or authorization response is exposed.
        project_key_parameter_supported:
          type: boolean
          const: true
          description: Every client-credentials token request binds exactly one project key.
    MCP20260728Request:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          description: Request identifier for an MCP request that expects a response.
          oneOf:
            - type: string
              minLength: 1
            - type: integer
        method:
          type: string
          enum:
            - server/discover
            - tools/list
            - tools/call
            - resources/list
            - resources/templates/list
            - resources/read
            - subscriptions/listen
        params:
          $ref: '#/components/schemas/MCP20260728CallParams'
    MCP20260728CallParams:
      type: object
      additionalProperties: true
      required: [_meta]
      properties:
        _meta:
          $ref: '#/components/schemas/MCPRequestMeta'
        notifications:
          type: object
          additionalProperties: true
          properties:
            resourceSubscriptions:
              type: array
              description: |
                Unique resource URIs requested by `subscriptions/listen`.
              minItems: 1
              maxItems: 64
              uniqueItems: true
              items:
                type: string
                format: uri
    MCPRequestMeta:
      type: object
      additionalProperties: true
      required:
        - io.modelcontextprotocol/protocolVersion
        - io.modelcontextprotocol/clientCapabilities
      properties:
        io.modelcontextprotocol/protocolVersion:
          type: string
          const: '2026-07-28'
        io.modelcontextprotocol/clientCapabilities:
          type: object
          additionalProperties: true
          description: |
            Capabilities declared independently on every request. Unattended
            service principals should opt into
            `io.modelcontextprotocol/oauth-client-credentials`; a valid Bearer
            token remains usable under core authorization rules when the
            extension is not declared.
          properties:
            extensions:
              type: object
              additionalProperties:
                type: object
              properties:
                io.modelcontextprotocol/oauth-client-credentials:
                  type: object
                  additionalProperties: false
        io.modelcontextprotocol/clientInfo:
          $ref: '#/components/schemas/MCPImplementation'
    MCPImplementation:
      type: object
      additionalProperties: true
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
        title:
          type: string
        version:
          type: string
          minLength: 1
        description:
          type: string
    MCP20260728Response:
      oneOf:
        - type: object
          additionalProperties: false
          required: [jsonrpc, id, result]
          properties:
            jsonrpc:
              type: string
              const: '2.0'
            id:
              oneOf:
                - type: string
                - type: integer
                - type: 'null'
            result:
              $ref: '#/components/schemas/MCPModernResult'
        - $ref: '#/components/schemas/MCPJSONRPCErrorResponse'
    MCPModernResult:
      type: object
      description: |
        MCP 2026-07-28 result. Every final result has `resultType`. Results
        that can be cached expose `ttlMs` and `cacheScope` together. Other
        method-specific fields remain governed by discovered tool and resource
        schemas.
      additionalProperties: true
      required: [resultType]
      dependentRequired:
        ttlMs: [cacheScope]
        cacheScope: [ttlMs]
      properties:
        resultType:
          type: string
          enum: [complete, input_required]
        ttlMs:
          type: integer
          minimum: 0
          description: Client cache freshness lifetime in milliseconds.
        cacheScope:
          type: string
          enum: [public, private]
        _meta:
          type: object
          additionalProperties: true
        inputRequests:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        requestState:
          type: string
          description: Opaque state echoed when retrying an input-required result.
    MCPJSONRPCErrorResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, error]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        error:
          $ref: '#/components/schemas/JSONRPCError'
    MCPSSEStream:
      type: string
      description: |
        UTF-8 Server-Sent Events containing JSON-RPC notifications in `data`
        fields. The stream has no event IDs and cannot be resumed; reconnect
        by issuing a fresh `subscriptions/listen` POST.
    JSONRPCRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        method:
          type: string
          minLength: 1
        params:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: true
    JSONRPCResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        result: true
        error:
          $ref: '#/components/schemas/JSONRPCError'
      oneOf:
        - required: [result]
        - required: [error]
      additionalProperties: false
    JSONRPCError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data: true
    A2AAgentCard:
      type: object
      required:
        - name
        - description
        - supportedInterfaces
        - version
        - capabilities
        - securitySchemes
