  /mcp:
    servers:
      - url: /
    post:
      tags: [MCP]
      operationId: sendMCPRequest
      summary: Send a stateless MCP 2026-07-28 JSON-RPC request
      description: |
        The endpoint implements only MCP 2026-07-28. Every POST is an
        independent authenticated request: protocol version, client
        capabilities, and optional client information are repeated in
        `params._meta`; no transport state or replay cursor exists.

        `Mcp-Method` must exactly match the JSON-RPC `method`. `Mcp-Name` must
        match `params.name` for `tools/call` and `params.uri` for
        `resources/read`. Every POST must advertise that it accepts both
        `application/json` and `text/event-stream`, even when the selected
        method normally returns only JSON. Ordinary methods return
        `application/json`.
        `subscriptions/listen` instead owns a long-lived
        `text/event-stream` response whose first message is
        `notifications/subscriptions/acknowledged`. Disconnecting the POST
        cancels that subscription; durable recovery uses the project-explicit
        `/api/v2/projects/{projectKey}/events` endpoint.
        A listen request may contain at most 64 unique resource URIs. Active
        listen streams are bounded to 256 globally, 8 per service principal,
        and 4 per credential.
      security:
        - oauth2: []
      parameters:
        - $ref: '#/components/parameters/MCPAccept'
        - $ref: '#/components/parameters/MCPProtocolVersion'
        - $ref: '#/components/parameters/MCPMethod'
        - $ref: '#/components/parameters/MCPName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCP20260728Request'
            examples:
              discover:
                summary: Discover the server without a handshake
                value:
                  jsonrpc: '2.0'
                  id: discover-1
                  method: server/discover
                  params:
                    _meta:
                      io.modelcontextprotocol/protocolVersion: '2026-07-28'
                      io.modelcontextprotocol/clientCapabilities:
                        extensions:
                          io.modelcontextprotocol/oauth-client-credentials: {}
                      io.modelcontextprotocol/clientInfo:
                        name: external-ticket-agent
                        version: 0.1.0
              callTool:
                summary: Call a tool using matching Mcp-Method and Mcp-Name headers
                value:
                  jsonrpc: '2.0'
                  id: call-1
                  method: tools/call
                  params:
                    _meta:
                      io.modelcontextprotocol/protocolVersion: '2026-07-28'
                      io.modelcontextprotocol/clientCapabilities:
                        extensions:
                          io.modelcontextprotocol/oauth-client-credentials: {}
                    name: ticket_get
                    arguments:
                      ticket_id: 42
              readResource:
                summary: Read a resource using its URI as the Mcp-Name header
                value:
                  jsonrpc: '2.0'
                  id: read-1
                  method: resources/read
                  params:
                    _meta:
                      io.modelcontextprotocol/protocolVersion: '2026-07-28'
                      io.modelcontextprotocol/clientCapabilities:
                        extensions:
                          io.modelcontextprotocol/oauth-client-credentials: {}
                    uri: ticket://tickets/42
              listen:
                summary: Open a scoped subscription stream
                value:
                  jsonrpc: '2.0'
                  id: listen-1
                  method: subscriptions/listen
                  params:
                    _meta:
                      io.modelcontextprotocol/protocolVersion: '2026-07-28'
                      io.modelcontextprotocol/clientCapabilities:
                        extensions:
                          io.modelcontextprotocol/oauth-client-credentials: {}
                    notifications:
                      resourceSubscriptions:
                        - ticket://tickets/42
      responses:
        '200':
          description: |
            A modern JSON-RPC result, or the long-lived SSE stream selected by
            `subscriptions/listen`. Complete JSON results carry `resultType`;
            cacheable discovery/list/read results additionally carry `ttlMs`
            and `cacheScope`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCP20260728Response'
              example:
                jsonrpc: '2.0'
                id: discover-1
                result:
                  resultType: complete
                  ttlMs: 300000
                  cacheScope: private
                  supportedVersions: ['2026-07-28']
                  capabilities:
                    extensions:
                      io.modelcontextprotocol/oauth-client-credentials: {}
                    tools: {}
                    resources:
                      subscribe: true
                  _meta:
                    io.modelcontextprotocol/serverInfo:
                      name: chronodesk
                      version: 0.3.0
            text/event-stream:
              schema:
                $ref: '#/components/schemas/MCPSSEStream'
              example: |-
                data: {"jsonrpc":"2.0","method":"notifications/subscriptions/acknowledged","params":{"_meta":{"io.modelcontextprotocol/subscriptionId":"listen-1"}}}

                data: {"jsonrpc":"2.0","method":"notifications/resources/updated","params":{"uri":"ticket://tickets/42","_meta":{"io.modelcontextprotocol/subscriptionId":"listen-1"}}}

        '400':
          description: |
            There are two intentionally distinct error representations.

            Transport validation performed by the official Go SDK before
            JSON-RPC dispatch—including an `Accept` header that does not
            contain both required media types, an empty body, or malformed
            JSON—returns HTTP 400 as `text/plain; charset=utf-8` using
            `http.Error`; it has no JSON-RPC envelope.

            After a request can be decoded as JSON-RPC, missing or mismatched
            modern headers, an invalid request `_meta`, unsupported protocol
            versions, and client-to-server notifications return HTTP 400 as
            an `application/json` JSON-RPC error envelope. The 2026-07-28
            Streamable HTTP core defines no client notification; cancellation
            is performed by closing the request response stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPJSONRPCErrorResponse'
              examples:
                missingHeader:
                  value:
                    jsonrpc: '2.0'
                    id: null
                    error:
                      code: -32020
                      message: missing required MCP-Protocol-Version header
                unsupportedVersion:
                  value:
                    jsonrpc: '2.0'
                    id: null
                    error:
                      code: -32022
                      message: unsupported protocol version
                      data:
                        supported: ['2026-07-28']
                        requested: unsupported-revision
                missingClientCapabilities:
                  value:
                    jsonrpc: '2.0'
                    id: request-1
                    error:
                      code: -32021
                      message: missing required client capabilities
                      data:
                        required:
                          - io.modelcontextprotocol/clientCapabilities
                clientNotification:
                  value:
                    jsonrpc: '2.0'
                    id: null
                    error:
                      code: -32600
                      message: Client-to-server notifications are not defined for Streamable HTTP
                subscriptionResourceLimit:
                  value:
                    jsonrpc: '2.0'
                    id: listen-1
                    error:
                      code: -32602
                      message: Invalid subscription request
                      data:
                        code: subscription_resource_limit_exceeded
                        limit: 64
                        requested: 65
                duplicateSubscriptionResource:
                  value:
                    jsonrpc: '2.0'
                    id: listen-1
                    error:
                      code: -32602
                      message: Invalid subscription request
                      data:
                        code: duplicate_subscription_resource
                        uri: ticket://tickets/42
            text/plain:
              schema:
                type: string
              examples:
                missingAccept:
                  summary: Accept omits one or both required response media types
                  value: |
                    Accept must contain both 'application/json' and 'text/event-stream'
                malformedBody:
                  summary: Body cannot be decoded as a JSON-RPC message
                  value: |
                    malformed payload: unmarshaling jsonrpc message: invalid character '}' looking for beginning of value
        '401':
          $ref: '#/components/responses/MCPUnauthorized'
        '403':
          description: |
            The authenticated service principal lacks a method-specific scope
            or its policy denies the requested action. An insufficient-scope
            response includes an OAuth Bearer challenge.
          headers:
            WWW-Authenticate:
              $ref: '#/components/headers/MCPBearerChallenge'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPJSONRPCErrorResponse'
              examples:
                insufficientScope:
                  value:
                    jsonrpc: '2.0'
                    id: call-1
                    error:
                      code: -32600
                      message: Insufficient scope
                      data:
                        code: insufficient_scope
                        required_scopes:
                          - tickets:read
                policyDenied:
                  value:
                    jsonrpc: '2.0'
                    id: call-1
                    error:
                      code: -32600
                      message: Action denied
                      data:
                        code: policy_denied
                        reason_code: action_not_allowed
                        policy_decision_id: pd_01JZ8VA6MHJZ23VC2M6N4PAPJ4
        '404':
          description: The requested MCP method or named tool does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPJSONRPCErrorResponse'
              example:
                jsonrpc: '2.0'
                id: request-1
                error:
                  code: -32601
                  message: method not found
        '405':
          description: Only stateless POST requests are supported.
          headers:
            Allow:
              description: The only supported HTTP method.
              required: true
              schema:
                type: string
                const: POST
          content:
            text/plain:
              schema:
                type: string
                const: Method Not Allowed
        '413':
          description: The MCP request body exceeds the configured 15 MiB bound.
          content:
            text/plain:
              schema:
                type: string
              example: request body too large
        '415':
          description: Request media type must be application/json.
        '429':
          description: |
            A `subscriptions/listen` stream limit was reached. Limits are
            enforced globally, per service principal, and per credential.
            Retry after another stream has closed.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
              example: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPJSONRPCErrorResponse'
              example:
                jsonrpc: '2.0'
                id: listen-2
                error:
                  code: -32600
                  message: Subscription stream limit exceeded
                  data:
                    code: subscription_limit_exceeded
                    limit_scope: credential
                    limit: 4
                    retryable: true

  /a2a/v1:
    servers:
      - url: /
    post:
      tags: [A2A]
      operationId: sendA2ARequest
      summary: Send an A2A 1.0 JSON-RPC request
      description: |
        Supports all A2A 1.0 JSON-RPC methods, including message send/stream,
        task list/get/cancel/subscribe, push notification configuration, and
        authenticated extended Agent Card retrieval. A2A task state is
        independent from ticket lifecycle state. URL parts are stored as
        references and are never fetched by the server. The protocol version
        must be supplied through either the A2A-Version header or the same-name
        query parameter; if both are present, they must match.
      security:
        - oauth2: ['tasks:manage']
      parameters:
        - $ref: '#/components/parameters/A2AVersion'
        - $ref: '#/components/parameters/A2AVersionQuery'
        - $ref: '#/components/parameters/LastEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
      responses:
        '200':
          description: JSON-RPC response or SSE task update stream, depending on method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
            text/event-stream:
              schema:
                type: string
              example: |-
                id: 87
                event: message
                data: {"taskId":"task-01","statusUpdate":{"status":{"state":"TASK_STATE_WORKING"}}}
        '400':
          description: Invalid A2A JSON-RPC request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          description: Content-Type must be application/json.

webhooks:
  domainEvent:
    post:
      operationId: receiveChronoDeskDomainEvent
      summary: Receive a reliably delivered ChronoDesk domain event
      description: |
        Custom Webhook consumers must authenticate the exact structured
        CloudEvent body before applying side effects. Compute
        `HMAC-SHA256(secret, timestamp + "." + exact_raw_body)`, compare the
        lowercase hexadecimal `v1=` signature in constant time, and reject
        timestamps outside the consumer's replay window. Consumers must also
        deduplicate by `(source, id)` or the stable `Idempotency-Key`.
      security:
        - webhookHmac: []
      parameters:
        - name: X-ChronoDesk-Timestamp
          in: header
          required: true
          description: |
            Decimal Unix time in seconds included in the signed input.
            Consumers should reject values outside their configured replay
            window before accepting the event.
          schema:
            type: string
            pattern: '^[0-9]{10,}$'
        - name: X-ChronoDesk-Signature
          in: header
          required: true
          description: |
            `v1=` followed by the lowercase hexadecimal HMAC-SHA256 of
            `timestamp + "." + exact_raw_body`, using the custom Webhook
            secret.
          schema:
            type: string
            pattern: '^v1=[a-f0-9]{64}$'
        - name: X-ChronoDesk-Signature-Previous
          in: header
          required: false
          description: |
            During an approved dual-key rotation window, ChronoDesk also
            signs the identical timestamp and raw body with the previous key.
            Consumers may accept either valid signature until the overlap
            expires; new integrations should prefer the primary signature.
          schema:
            type: string
            pattern: '^v1=[a-f0-9]{64}$'
        - name: X-CloudEvents-ID
          in: header
          required: true
          description: CloudEvent ID; must exactly match the structured body `id`.
          schema:
            type: string
            minLength: 1
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Stable identifier for this event and custom Webhook destination.
            Retries of the same delivery reuse this value.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-ChronoDesk-Delivery-ID
          in: header
          required: true
          description: Alias of `Idempotency-Key` for delivery tracing.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/CloudEvent'
            example:
              specversion: '1.0'
              id: 0f7a40e0-57e4-49a7-9449-8dc77349d83e
              source: urn:chronodesk:ticket-system
              type: io.chronodesk.ticket.updated.v1
              subject: ticket/42
              time: '2026-07-28T10:15:30Z'
              datacontenttype: application/json
              dataschema: https://chronodesk.example/openapi.yaml#/components/schemas/Ticket
              traceid: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
              correlationid: incident-2026-0042
              causationid: 32fa08bd-f60b-4357-bda7-caa38fd5b8d8
              actortype: service_principal
              actorid: 4d24ebd5-70bf-43f8-b0d1-e140d987292f
              resourceversion: 8
              data:
                ticket_id: 42
                changed_fields: [status]
                status: in_progress
                actor:
                  type: service_principal
                  id: 4d24ebd5-70bf-43f8-b0d1-e140d987292f
      responses:
        '202':
          description: Event accepted.
        '400':
          description: Invalid event envelope or signature.

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials for an independent service principal.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            tickets:read: Read visible tickets and their history.
            tickets:create: Create tickets.
            tickets:update: Update ordinary mutable ticket fields.
            tickets:assign: Assign or transfer tickets; explicit allow policy required.
            tickets:transition: Change ticket workflow state; explicit allow policy required.
            comments:write: Add public or internal comments.
            attachments:read: Read attachment metadata and clean file content.
            attachments:write: Upload inline attachment bytes.
            events:subscribe: Read domain events and subscribe to resource updates.
            tasks:manage: Claim work leases and manage A2A tasks.
            knowledge:read: Read authorized project knowledge.
            knowledge:write: Create and update knowledge drafts; never publish them.
    clientSecretBasic:
      type: http
      scheme: basic
      description: OAuth token-endpoint client authentication.
    humanBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Human browser session token. Project Agent administration additionally
        requires an active explicit `project_admin` Membership; platform duties
        alone never authorize these operations. This is not an Agent credential.
    webhookHmac:
      type: apiKey
      in: header
      name: X-ChronoDesk-Signature
      description: |
        Required for custom Webhooks. The value is
        `v1=<lowercase hex HMAC-SHA256(secret, timestamp + "." + exact_raw_body)>`,
        where `timestamp` is the exact `X-ChronoDesk-Timestamp` header value.

  parameters:
    HumanProjectKey:
      name: projectKey
      in: path
      required: true
      description: Human-authorized Project key resolved by the server.
      schema:
        $ref: '#/components/schemas/ProjectKey'
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 42
    KnowledgeArticleId:
      name: knowledgeArticleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgePage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    KnowledgePageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrincipalId:
      name: principalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor copied unchanged from `meta.next_cursor`. On
        object-filtered lists it advances beyond the last examined raw
        candidate, including candidates hidden by policy.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TicketContentCursor:
      name: cursor
      in: query
      description: |
        Opaque signed continuation cursor copied unchanged from
        `data.next_cursor`. It is bound to the Project, Ticket, endpoint, limit,
        filters, and stable sort order and cannot be reused across them.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    TicketContentLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    HistoryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Caller-generated key, scoped to actor and operation. Reuse with the
        same request digest returns the first result; reuse with a different
        digest returns `409 idempotency_conflict`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      example: agent-run-01JZ8VA6-ticket-42-step-3
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the current resource version used for optimistic concurrency.
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
      example: '"v7"'
    TicketLease:
      name: X-Ticket-Lease
      in: header
      required: true
      description: Active lease owned by the authenticated service principal.
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Caller correlation identifier copied to emitted domain events.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    CommandCorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: Non-empty caller correlation identifier copied to every command domain event.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    MCPAccept:
      name: Accept
      in: header
      required: true
      description: |
        Must contain both `application/json` and `text/event-stream` on every
        MCP POST. This remains mandatory for methods that produce only a JSON
        response, because the response transport is selected per request.
      schema:
        type: string
        minLength: 1
      example: application/json, text/event-stream
    MCPProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: true
      description: The only protocol revision implemented by this endpoint.
      schema:
        type: string
        const: '2026-07-28'
    MCPMethod:
      name: Mcp-Method
      in: header
      required: true
      description: Must exactly match the JSON-RPC body `method`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: tools/list
    MCPName:
      name: Mcp-Name
      in: header
      required: false
      description: |
        Required for `tools/call`, where it must exactly match `params.name`,
        and for `resources/read`, where it must exactly match `params.uri`.
        Omit it for methods without a named target.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      example: ticket_get
    A2AVersion:
      name: A2A-Version
      in: header
      required: false
      description: |
        A2A JSON-RPC protocol version supplied as a request header. Required
        unless A2A-Version is supplied as a query parameter. ChronoDesk exposes
        only A2A 1.0; missing or different values are rejected.
      schema:
        type: string
        const: '1.0'
    A2AVersionQuery:
      name: A2A-Version
      in: query
      required: false
      description: |
        A2A JSON-RPC protocol version supplied as a service query parameter.
        Required unless the A2A-Version header is present. When both forms are
        present their values must match.
      schema:
        type: string
        const: '1.0'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last received A2A event cursor for SSE reconnection.
      schema:
        type: string
        minLength: 1
        maxLength: 255

  headers:
    ETag:
      description: Strong resource-version validator formatted as `"v<number>"`.
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
      example: '"v8"'
    ParentETag:
      description: Strong validator for the parent resource advanced by this child-resource mutation.
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
      example: '"v9"'
    MCPBearerChallenge:
      description: |
        OAuth Bearer challenge with the MCP protected-resource metadata URL.
        Scope failures additionally include `error="insufficient_scope"` and
        a space-delimited `scope` value.
      schema:
        type: string
        pattern: '^Bearer [^\r\n]*resource_metadata="https?://[^"]+/.well-known/oauth-protected-resource/mcp"[^\r\n]*$'
      example: 'Bearer error="insufficient_scope", scope="tickets:read events:subscribe", resource_metadata="https://chronodesk.example/.well-known/oauth-protected-resource/mcp"'
  responses:
    BadRequest:
      description: Request shape, header, cursor, or command category is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://chronodesk.local/problems/invalid_request
            title: invalid request
            status: 400
            detail: 'If-Match must use the format "v<number>"'
            code: invalid_request
            request_id: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
            retryable: false
    Unauthorized:
      description: |
        Bearer token is missing, invalid, expired, or has the wrong audience.
        On service-principal endpoints, the challenge contains the exact
        audience-specific `resource_metadata` URL for `/api/v2` or `/a2a/v1`;
        human-admin endpoints use the human session challenge.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MCPUnauthorized:
      description: |
        The MCP bearer token is missing, invalid, expired, or has the wrong
        audience. The challenge points the client to protected-resource
        metadata for authorization discovery.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/MCPBearerChallenge'
      content:
        text/plain:
          schema:
            type: string
          example: no bearer token
    Forbidden:
      description: |
        The credential lacks the required scope or policy denied the action.
        The problem code is `insufficient_scope` or `policy_denied`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://chronodesk.local/problems/policy_denied
            title: policy denied
            status: 403
            detail: Risky action requires an explicit allow policy.
            code: policy_denied
            request_id: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
            retryable: false
    NotFound:
      description: Resource is missing or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        Optimistic version, lease ownership, or idempotency conflict. Inspect
        `code` for `version_conflict`, `lease_conflict`, or
        `idempotency_conflict`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            version:
              value:
                type: https://chronodesk.local/problems/version_conflict
                title: version conflict
                status: 409
                detail: Expected ticket version does not match current version.
                code: version_conflict
                request_id: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
                retryable: false
            lease:
              value:
                type: https://chronodesk.local/problems/lease_conflict
                title: lease conflict
                status: 409
                detail: Ticket lease is expired or held by another principal.
                code: lease_conflict
                request_id: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
                retryable: false
    AdminConflict:
      description: |
        Administrator resource version, command state, or idempotency conflict.
        For `version_conflict`, ETag contains the current strong resource
        validator and the caller must reload the corresponding overview or
        policy-list resource before retrying.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            version:
              value:
                type: https://chronodesk.local/problems/version_conflict
                title: version conflict
                status: 409
                detail: Administrator resource version does not match.
                code: version_conflict
                request_id: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
                retryable: false
            idempotency:
              value:
                type: https://chronodesk.local/problems/idempotency_conflict
                title: idempotency conflict
                status: 409
                detail: Idempotency key was reused with different command input.
                code: idempotency_conflict
                request_id: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
                retryable: false
    PreconditionRequired:
      description: A mutating request omitted the mandatory current-resource `If-Match` validator.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://chronodesk.local/problems/precondition_required
            title: precondition required
            status: 428
            detail: If-Match is required for this administrator command.
            code: precondition_required
            request_id: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
            retryable: false
    ServiceUnavailable:
      description: A required shared execution-protection or persistence dependency is temporarily unavailable.
      headers:
        Retry-After:
          description: Minimum number of seconds before a retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://chronodesk.local/problems/service_unavailable
            title: service unavailable
            status: 503
            detail: Agent execution protection is temporarily unavailable.
            code: service_unavailable
            request_id: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
            retryable: true
    TooManyRequests:
      description: Principal rate or concurrency limit exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Attachment or request body exceeds the configured limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: The command failed before a durable, replayable result could be committed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://chronodesk.local/problems/internal_error
            title: internal error
            status: 500
            detail: Failed to persist administrator domain event.
            code: internal_error
            request_id: req_01JZ8VA6MHJZ23VC2M6N4PAPJ4
            retryable: true
    AttachmentRejected:
      description: Attachment name, malware-scan state, or content is not acceptable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
        next_cursor:
          type: string
          description: Opaque continuation cursor; clients must not inspect or modify it.
        has_more:
          type: boolean
          description: Whether the underlying candidate stream may contain another page.
    Envelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: true
        meta:
          $ref: '#/components/schemas/Meta'
        receipt:
          $ref: '#/components/schemas/Receipt'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id, retryable]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - invalid_ticket_transition
            - invalid_assignee
            - assignee_not_found
            - assignee_policy_denied
            - precondition_required
            - unauthorized
            - invalid_actor
            - invalid_scope
            - principal_not_found
            - principal_disabled
            - principal_expired
            - invalid_credential
            - credential_expired
            - insufficient_scope
            - policy_denied
            - agent_emergency_stop
            - read_only
            - automation_loop
            - not_found
            - version_conflict
            - lease_conflict
            - lease_expired
            - lease_not_owned
            - idempotency_conflict
            - idempotency_in_progress
            - command_scope_mismatch
            - outbox_replay_conflict
            - outbox_replay_expired
            - rate_limited
            - concurrency_limit
            - execution_guard_unavailable
            - attachment_rejected
            - attachment_too_large
            - attachment_not_clean
            - invalid_attachment
            - invalid_attachment_name
            - nested_comment_reply
            - invalid_comment
            - ticket_configuration_unavailable
            - request_type_version_required
            - ticket_form_validation_failed
            - service_unavailable
            - internal_error
        request_id:
          type: string
        retryable:
          type: boolean
    Receipt:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - resource_id
        - resource_version
        - event_id
        - changed_fields
        - policy_decision_id
      properties:
        operation_id:
          type: string
          minLength: 1
        resource_id:
          type: string
          minLength: 1
        resource_version:
          $ref: '#/components/schemas/ResourceVersion'
        event_id:
          type: string
          minLength: 1
        changed_fields:
          type: array
          items:
            type: string
        policy_decision_id:
          type: string
    ResourceVersion:
      type: integer
      minimum: 1
      description: Monotonically increasing optimistic-concurrency version.
    ActorRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [human, service_principal, system]
        id:
          type: string
          minLength: 1
    AssignableActorRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [human, service_principal]
        id:
          type: string
          minLength: 1
    TicketStatus:
      type: string
      enum: [open, in_progress, pending, resolved, closed, cancelled]
    TicketPriority:
      type: string
      enum: [low, normal, high, urgent, critical]
    TicketType:
      type: string
      enum: [incident, request, problem, change, complaint, consultation]
    TicketSource:
      type: string
      enum: [web, email, phone, chat, api, mobile, agent]
    ConfigurationVersionID:
      type: string
      format: uuid
      description: Immutable published project configuration version identifier.
    AgentContext:
      type: object
      additionalProperties: false
      properties:
        goal:
          type: string
          maxLength: 4000
        constraints:
          type: array
          items:
            type: string
            maxLength: 1000
        acceptance_criteria:
          type: array
          items:
            type: string
            maxLength: 1000
        missing_information:
          type: array
          items:
            type: string
            maxLength: 1000
        related_resources:
          type: array
          description: Opaque references; the server never fetches them.
          items:
            type: string
            maxLength: 2048
    Ticket:
      type: object
      required:
        - id
        - created_at
        - updated_at
        - ticket_number
        - request_type_version_id
        - workflow_version_id
        - title
        - description
        - type
        - priority
        - status
        - source
        - tags
        - version
        - agent_context
        - trust_level
        - created_by_actor
        - sla_breached
        - is_overdue
        - is_escalated
      properties:
        id:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ticket_number:
          type: string
          maxLength: 50
        request_type_version_id:
          $ref: '#/components/schemas/ConfigurationVersionID'
        workflow_version_id:
          $ref: '#/components/schemas/ConfigurationVersionID'
        title:
          type: string
          maxLength: 255
          description: Untrusted external data.
        description:
          type: string
          description: Untrusted external data.
        type:
          $ref: '#/components/schemas/TicketType'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        status:
          $ref: '#/components/schemas/TicketStatus'
        source:
          $ref: '#/components/schemas/TicketSource'
        version:
          type: integer
          minimum: 1
        trust_level:
          type: string
          enum: [untrusted, verified, trusted, system]
        agent_context:
          $ref: '#/components/schemas/AgentContext'
        created_by_actor:
          $ref: '#/components/schemas/ActorRef'
        assigned_to_actor:
          oneOf:
            - $ref: '#/components/schemas/ActorRef'
            - type: 'null'
        tags:
          type: array
          items:
            type: string
        category:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        subcategory:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        due_date:
          type: [string, 'null']
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
        first_reply_at:
          type: [string, 'null']
          format: date-time
        sla_breached:
          type: boolean
        sla_due_date:
          type: [string, 'null']
          format: date-time
        response_time:
          type: [integer, 'null']
        resolution_time:
          type: [integer, 'null']
        customer_email:
          type: string
        customer_phone:
          type: string
        customer_name:
          type: string
        custom_fields:
          type: object
          additionalProperties: true
        view_count:
          type: integer
        comment_count:
          type: integer
        rating:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
        rating_comment:
          type: string
        is_overdue:
          type: boolean
        is_escalated:
          type: boolean
      additionalProperties: true
    TicketCreate:
      type: object
      additionalProperties: false
      required:
        - title
        - description
        - type
        - priority
        - request_type_version_id
        - workflow_version_id
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          $ref: '#/components/schemas/TicketType'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        request_type_version_id:
          $ref: '#/components/schemas/ConfigurationVersionID'
        workflow_version_id:
          $ref: '#/components/schemas/ConfigurationVersionID'
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 64
        agent_context:
          $ref: '#/components/schemas/AgentContext'
        category_id:
          type: [integer, 'null']
          minimum: 1
        due_date:
          type: [string, 'null']
          format: date-time
    TicketFieldPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          $ref: '#/components/schemas/TicketType'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        category_id:
          type: [integer, 'null']
          minimum: 1
        subcategory_id:
          type: [integer, 'null']
          minimum: 1
        tags:
          type: array
          items:
            type: string
        due_date:
          type: [string, 'null']
          format: date-time
        customer_email:
          type: string
          maxLength: 100
        customer_phone:
          type: string
          maxLength: 20
        customer_name:
          type: string
          maxLength: 100
        internal_notes:
          type: string
          maxLength: 10000
        custom_fields:
          type: object
          additionalProperties: true
        agent_context:
          $ref: '#/components/schemas/AgentContext'
    TicketAssignCommand:
      type: object
      additionalProperties: false
      required: [assignee, reason]
      properties:
        assignee:
          oneOf:
            - $ref: '#/components/schemas/AssignableActorRef'
            - type: 'null'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Short auditable rationale; never include chain-of-thought.
    TicketTransitionCommand:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
