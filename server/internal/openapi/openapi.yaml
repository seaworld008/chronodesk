  /integrations/inbound/{connectionId}/mappings/{mappingId}/messages:
    post:
      tags: [Integrations]
      operationId: receiveProjectIntegrationMessageV2
      summary: Apply one signed external-system message
      description: |
        Resolves the opaque Connection and immutable published Mapping inside
        the project selected by the URL. The signature covers the exact UTF-8
        framing `v1\n{timestamp}\n{projectKey}\n{connectionId}\n{mappingId}\n`
        `+ {Idempotency-Key}\n{externalResourceType}\n{externalResourceId}\n`
        `+ {normalizedContentType}\n{exact_raw_body}`. All routing and
        idempotency metadata is therefore authenticated. Duplicate
        `Idempotency-Key` values replay the original receipt and never repeat
        the domain effect. Project, queue, Actor, credential and permission
        values in the body are untrusted and cannot select the execution
        scope.
      security:
        - webhookHmac: []
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: mappingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 191
        - name: X-ChronoDesk-Timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]{9,18}$'
        - name: X-ChronoDesk-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^v1=[a-f0-9]{64}$'
        - name: X-ChronoDesk-External-Resource-Type
          in: header
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9._-]{0,63}$'
        - name: X-ChronoDesk-External-Resource-ID
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 191
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/cloudevents+json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Message accepted and one domain effect committed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '200':
          description: Idempotent replay of the original receipt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: Message was rejected by mapping/domain validation and dead-lettered.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

