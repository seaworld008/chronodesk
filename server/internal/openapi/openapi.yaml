  /oauth/token:
    servers:
      - url: /
    post:
      tags: [OAuth]
      operationId: issueServicePrincipalAccessToken
      summary: Exchange a service-principal credential for a short-lived token
      description: |
        Accepts only `application/x-www-form-urlencoded` and supports
        `client_secret_basic` and `client_secret_post`. The requested scope
        must be a subset of both the principal's allowed scopes and its
        project grant. `project_key` is mandatory and binds the token to one
        authorized project. The RFC 8707
        `resource` indicator is mandatory and must exactly equal one canonical
        protected resource: `${APP_URL}/mcp`, `${APP_URL}/api/v2`, or
        `${APP_URL}/a2a/v1`. The selected value becomes the JWT audience;
        tokens are rejected by the other two resources. Missing, multiple, or
        mismatched resource indicators return `invalid_target`.
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
            examples:
              mcp:
                summary: Token restricted to MCP
                value:
                  grant_type: client_credentials
                  client_id: 4d24ebd5-70bf-43f8-b0d1-e140d987292f
                  client_secret: credential-id.one-time-secret
                  project_key: OPS
                  scope: tickets:read tasks:manage
                  resource: https://chronodesk.example/mcp
              api:
                summary: Token restricted to the Agent REST API
                value:
                  grant_type: client_credentials
                  client_id: 4d24ebd5-70bf-43f8-b0d1-e140d987292f
                  client_secret: credential-id.one-time-secret
                  project_key: OPS
                  scope: tickets:read
                  resource: https://chronodesk.example/api/v2
              a2a:
                summary: Token restricted to A2A
                value:
                  grant_type: client_credentials
                  client_id: 4d24ebd5-70bf-43f8-b0d1-e140d987292f
                  client_secret: credential-id.one-time-secret
                  project_key: OPS
                  scope: tasks:manage tickets:read
                  resource: https://chronodesk.example/a2a/v1
      responses:
        '200':
          description: Short-lived service-principal access token.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: |
            Unsupported grant type, invalid scope, or missing/mismatched
            canonical protected-resource indicator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              examples:
                invalidRequest:
                  summary: JSON and other non-form token requests are rejected
                  value:
                    error: invalid_request
                    error_description: The token request is malformed
                invalidTarget:
                  value:
                    error: invalid_target
                    error_description: The resource parameter must exactly match one advertised protected resource
        '401':
          description: Invalid client credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: Anonymous token request limit exceeded for the source client address.
          headers:
            Retry-After:
              description: Seconds until this client can retry the token request.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

