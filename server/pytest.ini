[pytest]
# pytest配置文件
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记定义
markers =
    slow: 标记测试为慢速测试
    integration: 标记为集成测试
    unit: 标记为单元测试
    api: 标记为API测试
    performance: 标记为性能测试

# 输出选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --durations=10

# 最小版本要求（与 requirements-test.txt 保持一致）
minversion = 7.4

# 测试发现
norecursedirs = .git .tox dist build reports htmlcov *.egg
